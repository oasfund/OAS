<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Repeat Loan Application</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>🔄 Repeat Loan Application</h1>

<p>For Existing Non-Member Borrowers</p>

</header>

<main class="container">

<form id="repeatLoanForm">

<label>Previous Loan Reference No.</label>
<input type="text" placeholder="Loan Reference Number" required>

<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" required>

<label>Mobile Number</label>
<input type="tel" placeholder="09XXXXXXXXX" required>

<label>New Loan Amount</label>
<input type="number" placeholder="Loan Amount" required>

<label>Loan Purpose</label>
<textarea placeholder="Purpose of Loan" required></textarea>

<br><br>

<button type="submit">

Submit Repeat Loan

</button>

</form>

</main>

<script>

document.getElementById("repeatLoanForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Repeat Loan Application Submitted Successfully!");

this.reset();

});

</script>

</body>
</html>
