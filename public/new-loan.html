<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Loan Application</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>💰 NEW LOAN APPLICATION</h1>

<p>Non-Member Loan Application</p>

</header>

<main class="container">

<form id="loanForm">

<label>Full Name</label>

<input
type="text"
id="fullName"
required>

<label>Mobile Number</label>

<input
type="text"
id="mobile"
required>

<label>Complete Address</label>

<textarea
id="address"
required></textarea>

<label>Loan Amount</label>

<input
type="number"
id="amount"
required>

<label>Loan Purpose</label>

<textarea
id="purpose"
required></textarea>

<br>

<button type="submit">

Submit Application

</button>

</form>

</main>

<script src="../js/app.js"></script>

<script>

document.getElementById("loanForm").addEventListener("submit",function(e){

e.preventDefault();

const loan={

fullName:fullName.value,

mobile:mobile.value,

address:address.value,

amount:Number(amount.value),

purpose:purpose.value

};

const result=saveLoan(loan);

alert(

"Application Submitted Successfully!\n\nReference No.: "+result.reference

);

this.reset();

});

</script>

</body>
</html>
