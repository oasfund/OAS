<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Status</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>🏦 OAS Management System</h1>

</header>

<main class="container">

<h2>Loan Status Inquiry</h2>

<form id="statusForm">

<label>Loan Reference Number</label>

<input type="text" id="referenceNo" placeholder="Enter Reference Number" required>

<br><br>

<button type="submit">

Check Status

</button>

</form>

<br>

<div id="result"></div>

</main>

<script>

document.getElementById("statusForm").addEventListener("submit",function(e){

e.preventDefault();

const ref=document.getElementById("referenceNo").value;

document.getElementById("result").innerHTML=

"<h3>Loan Reference: "+ref+"</h3><p>Status: <strong>Pending Verification</strong></p>";

});

</script>

</body>
</html>
