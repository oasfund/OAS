<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Status</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>📋 LOAN STATUS</h1>

<p>Track Your Loan Application</p>

</header>

<main class="container">

<form id="statusForm">

<label>Reference Number</label>

<input
type="text"
id="reference"
placeholder="LN-000001"
required>

<br>

<button type="submit">

Check Status

</button>

</form>

<br>

<div class="card" id="result">

<p>Enter your Loan Reference Number.</p>

</div>

</main>

<script src="../js/app.js"></script>

<script>

document.getElementById("statusForm").addEventListener("submit",function(e){

e.preventDefault();

const loans=getData(STORAGE.loans);

const loan=loans.find(x=>x.reference===reference.value);

if(!loan){

result.innerHTML="<h3>Loan Not Found</h3>";

return;

}

result.innerHTML=`

<h2>${loan.fullName}</h2>

<p><strong>Reference :</strong> ${loan.reference}</p>

<p><strong>Loan Amount :</strong> ₱${Number(loan.amount).toFixed(2)}</p>

<p><strong>Status :</strong> ${loan.status}</p>

<p><strong>Total Payment :</strong> ₱${Number(loan.payment||0).toFixed(2)}</p>

`;

});

</script>

</body>
</html>
