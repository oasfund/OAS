<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>🏦 OAS Management System</h1>

</header>

<main class="container">

<h2>Member Login</h2>

<form id="loginForm">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Username"
required>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
required>

<br><br>

<button type="submit">

Login

</button>

</form>

</main>

<script src="../js/app.js"></script>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const username=document.getElementById("username").value;

const password=document.getElementById("password").value;

const members=JSON.parse(localStorage.getItem("oas_members"))||[];

const member=members.find(m=>m.username===username&&m.password===password);

if(member){

localStorage.setItem("oas_current_member",JSON.stringify(member));

alert("Welcome "+member.fullName);

window.location="dashboard.html";

}else{

alert("Invalid Username or Password");

}

});

</script>

</body>
</html>
