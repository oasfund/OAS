<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>🏦 OAS Member Dashboard</h1>

</header>

<main class="container">

<h2 id="welcome">Welcome</h2>

<div class="card">
<h3>👤 Profile</h3>
<p><a href="profile.html">Open Profile</a></p>
</div>

<div class="card">
<h3>💰 My Loans</h3>
<p><a href="my-loans.html">Open My Loans</a></p>
</div>

<div class="card">
<h3>📅 Contributions</h3>
<p><a href="contributions.html">Open Contributions</a></p>
</div>

<div class="card">
<h3>🎁 Referral Incentives</h3>
<p><a href="referrals.html">Open Referrals</a></p>
</div>

<br>

<button onclick="logout()">
Logout
</button>

</main>

<script>

const member=JSON.parse(localStorage.getItem("oas_current_member"));

if(!member){

window.location="login.html";

}

document.getElementById("welcome").innerHTML="Welcome, "+member.fullName;

function logout(){

localStorage.removeItem("oas_current_member");

window.location="login.html";

}

</script>

</body>
</html>
