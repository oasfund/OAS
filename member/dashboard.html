<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>👤 MEMBER DASHBOARD</h1>

<p>OAS Management System</p>

<nav>

<a href="dashboard.html">Dashboard</a>

<a href="profile.html">Profile</a>

<a href="my-loans.html">My Loans</a>

<a href="contributions.html">Contributions</a>

<a href="referrals.html">Referrals</a>

</nav>

</header>

<main class="container">

<div class="card">

<h2 id="welcome">Welcome</h2>

<p><strong>Member ID :</strong> <span id="memberId"></span></p>

<p><strong>Status :</strong> <span id="status"></span></p>

</div>

<div class="features">

<div class="card">

<h3>💰 My Loans</h3>

<h1 id="loanCount">0</h1>

</div>

<div class="card">

<h3>📅 Contributions</h3>

<h1 id="contributionTotal">₱0.00</h1>

</div>

<div class="card">

<h3>🎁 Referral Incentives</h3>

<h1 id="referralTotal">₱0.00</h1>

</div>

</div>

<br>

<button onclick="logout()">

Logout

</button>

</main>

<script src="../js/app.js"></script>

<script>

const member=JSON.parse(localStorage.getItem(STORAGE.currentMember));

if(!member){

window.location="login.html";

}

document.getElementById("welcome").textContent="Welcome, "+member.fullName;

document.getElementById("memberId").textContent=member.memberId;

document.getElementById("status").textContent=member.status;

const loans=getData(STORAGE.loans).filter(

l=>l.fullName===member.fullName

);

document.getElementById("loanCount").textContent=loans.length;

const contributions=getData(STORAGE.contributions).filter(

c=>c.memberId===member.memberId

);

let totalContribution=0;

contributions.forEach(c=>{

totalContribution+=Number(c.amount);

});

document.getElementById("contributionTotal").textContent="₱"+totalContribution.toFixed(2);

const referrals=getData(STORAGE.referrals).filter(

r=>r.referrer===member.fullName

);

let totalReferral=0;

referrals.forEach(r=>{

totalReferral+=Number(r.amount);

});

document.getElementById("referralTotal").textContent="₱"+totalReferral.toFixed(2);

function logout(){

localStorage.removeItem(STORAGE.currentMember);

window.location="login.html";

}

</script>

</body>
</html>
