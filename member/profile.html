<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>👤 MY PROFILE</h1>

<p>OAS Management System</p>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="profile.html">Profile</a>
<a href="my-loans.html">My Loans</a>
<a href="contributions.html">Contributions</a>
<a href="referrals.html">Referrals</a>

</nav>

</header>

<main class="container">

<form id="profileForm">

<label>Member ID</label>

<input
type="text"
id="memberId"
readonly>

<label>Full Name</label>

<input
type="text"
id="fullName"
required>

<label>Mobile Number</label>

<input
type="text"
id="mobile"
required>

<label>Email Address</label>

<input
type="email"
id="email"
required>

<label>Complete Address</label>

<textarea
id="address"
required></textarea>

<br>

<button type="submit">

Update Profile

</button>

</form>

</main>

<script src="../js/app.js"></script>

<script>

const member=JSON.parse(localStorage.getItem(STORAGE.currentMember));

if(!member){

window.location="login.html";

}

memberId.value=member.memberId;

fullName.value=member.fullName;

mobile.value=member.mobile;

email.value=member.email;

address.value=member.address;

document.getElementById("profileForm").addEventListener("submit",function(e){

e.preventDefault();

let members=getData(STORAGE.members);

const index=members.findIndex(m=>m.memberId===member.memberId);

members[index].fullName=fullName.value;

members[index].mobile=mobile.value;

members[index].email=email.value;

members[index].address=address.value;

saveData(STORAGE.members,members);

localStorage.setItem(STORAGE.currentMember,JSON.stringify(members[index]));

alert("Profile Updated Successfully.");

});

</script>

</body>
</html>
