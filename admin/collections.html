<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collections</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>💳 COLLECTION MANAGEMENT</h1>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>

</nav>

</header>

<main class="container">

<h2>Released Loans</h2>

<table id="collectionTable">

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Loan Amount</th>
<th>Total Paid</th>
<th>Balance</th>
<th>Action</th>

</tr>

</table>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

let loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const table=document.getElementById("collectionTable");

function save(){

localStorage.setItem("oas_loans",JSON.stringify(loans));

}

function load(){

table.innerHTML=`

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Loan Amount</th>
<th>Total Paid</th>
<th>Balance</th>
<th>Action</th>

</tr>

`;

const released=loans.filter(x=>x.status==="Released");

if(released.length===0){

table.innerHTML+=`

<tr>

<td colspan="6" align="center">

No Released Loans

</td>

</tr>

`;

return;

}

released.forEach(loan=>{

const paid=Number(loan.payment||0);

const balance=Number(loan.amount)-paid;

table.innerHTML+=`

<tr>

<td>${loan.reference}</td>

<td>${loan.fullName}</td>

<td>₱${Number(loan.amount).toFixed(2)}</td>

<td>₱${paid.toFixed(2)}</td>

<td>₱${balance.toFixed(2)}</td>

<td>

<button onclick="collect('${loan.reference}')">

Collect ₱100

</button>

</td>

</tr>

`;

});

}

function collect(reference){

const loan=loans.find(x=>x.reference===reference);

loan.payment=Number(loan.payment||0)+100;

if(loan.payment>=Number(loan.amount)){

loan.status="Completed";

}

save();

load();

}

load();

</script>

</body>
</html>
