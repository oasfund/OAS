<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Borrowers Masterlist</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>👤 BORROWERS MASTERLIST</h1>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>

</nav>

</header>

<main class="container">

<h2>Borrower Records</h2>

<table id="borrowerTable">

<tr>

<th>Reference No.</th>

<th>Borrower</th>

<th>Mobile</th>

<th>Loan Amount</th>

<th>Status</th>

</tr>

</table>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

const loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const table=document.getElementById("borrowerTable");

if(loans.length===0){

table.innerHTML+=`

<tr>

<td colspan="5" align="center">

No Borrower Records Found

</td>

</tr>

`;

}else{

loans.forEach(loan=>{

table.innerHTML+=`

<tr>

<td>${loan.reference}</td>

<td>${loan.fullName}</td>

<td>${loan.mobile}</td>

<td>₱${Number(loan.amount).toFixed(2)}</td>

<td>${loan.status}</td>

</tr>

`;

});

}

</script>

</body>
</html>
