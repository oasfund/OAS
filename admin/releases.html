<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Releases</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>💵 LOAN RELEASES</h1>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>

</nav>

</header>

<main class="container">

<h2>Approved Loans</h2>

<table id="releaseTable">

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Amount</th>
<th>Status</th>
<th>Release</th>

</tr>

</table>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

let loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const table=document.getElementById("releaseTable");

function save(){

localStorage.setItem("oas_loans",JSON.stringify(loans));

}

function load(){

table.innerHTML=`

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Amount</th>
<th>Status</th>
<th>Release</th>

</tr>

`;

const approved=loans.filter(x=>x.status==="Approved");

if(approved.length===0){

table.innerHTML+=`

<tr>

<td colspan="5" align="center">

No Approved Loans

</td>

</tr>

`;

return;

}

approved.forEach(loan=>{

table.innerHTML+=`

<tr>

<td>${loan.reference}</td>

<td>${loan.fullName}</td>

<td>₱${Number(loan.amount).toFixed(2)}</td>

<td>${loan.status}</td>

<td>

<button onclick="releaseLoan('${loan.reference}')">

Release

</button>

</td>

</tr>

`;

});

}

function releaseLoan(reference){

const loan=loans.find(x=>x.reference===reference);

loan.status="Released";

save();

load();

alert("Loan Released Successfully");

}

load();

</script>

</body>

</html>
