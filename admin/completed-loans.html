<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Completed Loans</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>✅ COMPLETED LOANS</h1>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>

</nav>

</header>

<main class="container">

<h2>Fully Paid Loans</h2>

<table id="completedTable">

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Loan Amount</th>
<th>Total Paid</th>
<th>Status</th>

</tr>

</table>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

const loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const table=document.getElementById("completedTable");

const completed=loans.filter(x=>x.status==="Completed");

if(completed.length===0){

table.innerHTML+=`

<tr>

<td colspan="5" align="center">

No Completed Loans

</td>

</tr>

`;

}else{

completed.forEach(loan=>{

table.innerHTML+=`

<tr>

<td>${loan.reference}</td>

<td>${loan.fullName}</td>

<td>₱${Number(loan.amount).toFixed(2)}</td>

<td>₱${Number(loan.payment||0).toFixed(2)}</td>

<td>${loan.status}</td>

</tr>

`;

});

}

</script>

</body>

</html>
