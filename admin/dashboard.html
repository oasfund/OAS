<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OAS Executive Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>🏦 OAS MANAGEMENT SYSTEM</h1>

<p>Executive Dashboard</p>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>

</nav>

</header>

<main class="container">

<div class="features">

<div class="card">

<h3>Total Members</h3>

<h1 id="members">0</h1>

</div>

<div class="card">

<h3>Total Borrowers</h3>

<h1 id="borrowers">0</h1>

</div>

<div class="card">

<h3>Loan Applications</h3>

<h1 id="applications">0</h1>

</div>

<div class="card">

<h3>Released Loans</h3>

<h1 id="released">0</h1>

</div>

<div class="card">

<h3>Completed Loans</h3>

<h1 id="completed">0</h1>

</div>

<div class="card">

<h3>Total Collections</h3>

<h1 id="collections">₱0.00</h1>

</div>

</div>

</main>

<script>

const members=JSON.parse(localStorage.getItem("oas_members"))||[];

const loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

document.getElementById("members").innerHTML=members.length;

document.getElementById("borrowers").innerHTML=loans.length;

document.getElementById("applications").innerHTML=loans.length;

document.getElementById("released").innerHTML=loans.filter(x=>x.status==="Released").length;

document.getElementById("completed").innerHTML=loans.filter(x=>x.status==="Completed").length;

let total=0;

loans.forEach(x=>{

total+=Number(x.payment||0);

});

document.getElementById("collections").innerHTML="₱"+total.toFixed(2);

</script>

</body>
</html>
