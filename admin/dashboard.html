<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAS Admin Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>🛡 OAS ADMIN DASHBOARD</h1>

</header>

<main class="container">

<h2>System Overview</h2>

<div class="card">

<p><strong>Total Members</strong></p>

<h2 id="members">0</h2>

</div>

<br>

<div class="card">

<p><strong>Total Loan Applications</strong></p>

<h2 id="loans">0</h2>

</div>

<br>

<div class="card">

<p><strong>Pending Loans</strong></p>

<h2 id="pending">0</h2>

</div>

<br>

<div class="card">

<p><strong>Approved Loans</strong></p>

<h2 id="approved">0</h2>

</div>

<br>

<div class="card">

<p><strong>Rejected Loans</strong></p>

<h2 id="rejected">0</h2>

</div>

<br>

<h2>Administration</h2>

<ul>

<li><a href="members.html">👥 Member Management</a></li>

<li><a href="loans.html">💰 Loan Management</a></li>

<li><a href="contributions.html">📅 Contributions</a></li>

<li><a href="referrals.html">🎁 Referral Incentives</a></li>

<li><a href="reports.html">📊 Reports</a></li>

<li><a href="settings.html">⚙ Settings</a></li>

</ul>

</main>

<script>

const members=JSON.parse(localStorage.getItem("oas_members"))||[];

const loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

document.getElementById("members").innerHTML=members.length;

document.getElementById("loans").innerHTML=loans.length;

document.getElementById("pending").innerHTML=loans.filter(x=>x.status==="Pending").length;

document.getElementById("approved").innerHTML=loans.filter(x=>x.status==="Approved").length;

document.getElementById("rejected").innerHTML=loans.filter(x=>x.status==="Rejected").length;

</script>

</body>
</html>
