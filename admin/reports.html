<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OAS Reports</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>📊 OAS Reports</h1>

</header>

<main class="container">

<h2>System Summary</h2>

<div class="card">

<p><strong>Total Members :</strong> <span id="members"></span></p>

<p><strong>Total Loan Applications :</strong> <span id="loans"></span></p>

<p><strong>Pending Loans :</strong> <span id="pending"></span></p>

<p><strong>Approved Loans :</strong> <span id="approved"></span></p>

<p><strong>Rejected Loans :</strong> <span id="rejected"></span></p>

<p><strong>Total Contributions :</strong> ₱<span id="contributions"></span></p>

<p><strong>Total Referral Incentives :</strong> ₱<span id="referrals"></span></p>

</div>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

const members=JSON.parse(localStorage.getItem("oas_members"))||[];

const loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const contributions=JSON.parse(localStorage.getItem("oas_contributions"))||[];

const referrals=JSON.parse(localStorage.getItem("oas_referrals"))||[];

document.getElementById("members").innerHTML=members.length;

document.getElementById("loans").innerHTML=loans.length;

document.getElementById("pending").innerHTML=loans.filter(x=>x.status==="Pending").length;

document.getElementById("approved").innerHTML=loans.filter(x=>x.status==="Approved").length;

document.getElementById("rejected").innerHTML=loans.filter(x=>x.status==="Rejected").length;

let contributionTotal=0;

contributions.forEach(c=>{

contributionTotal+=Number(c.amount);

});

document.getElementById("contributions").innerHTML=contributionTotal.toFixed(2);

let referralTotal=0;

referrals.forEach(r=>{

referralTotal+=Number(r.amount);

});

document.getElementById("referrals").innerHTML=referralTotal.toFixed(2);

</script>

</body>
</html>
