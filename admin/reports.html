<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Executive Reports</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>📊 EXECUTIVE REPORTS</h1>

<p>OAS Management System</p>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>

</nav>

</header>

<main class="container">

<div class="card">

<h2>System Summary</h2>

<table>

<tr>
<td>Total Members</td>
<td id="members"></td>
</tr>

<tr>
<td>Total Borrowers</td>
<td id="borrowers"></td>
</tr>

<tr>
<td>Total Loan Portfolio</td>
<td id="portfolio"></td>
</tr>

<tr>
<td>Total Collections</td>
<td id="collections"></td>
</tr>

<tr>
<td>Outstanding Balance</td>
<td id="balance"></td>
</tr>

<tr>
<td>Pending Loans</td>
<td id="pending"></td>
</tr>

<tr>
<td>Approved Loans</td>
<td id="approved"></td>
</tr>

<tr>
<td>Released Loans</td>
<td id="released"></td>
</tr>

<tr>
<td>Completed Loans</td>
<td id="completed"></td>
</tr>

</table>

</div>

</main>

<script src="../js/app.js"></script>

<script>

const summary=dashboardSummary();

document.getElementById("members").textContent=summary.members;

document.getElementById("borrowers").textContent=summary.borrowers;

document.getElementById("pending").textContent=summary.pending;

document.getElementById("approved").textContent=summary.approved;

document.getElementById("released").textContent=summary.released;

document.getElementById("completed").textContent=summary.completed;

const loans=getData(STORAGE.loans);

let portfolio=0;

let collections=0;

loans.forEach(loan=>{

portfolio+=Number(loan.amount||0);

collections+=Number(loan.payment||0);

});

document.getElementById("portfolio").textContent="₱"+portfolio.toFixed(2);

document.getElementById("collections").textContent="₱"+collections.toFixed(2);

document.getElementById("balance").textContent="₱"+(portfolio-collections).toFixed(2);

</script>

</body>
</html>
