<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Management</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>💰 LOAN MANAGEMENT</h1>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="members.html">Members</a>
<a href="borrowers.html">Borrowers</a>
<a href="loans.html">Loans</a>
<a href="releases.html">Releases</a>
<a href="collections.html">Collections</a>
<a href="reports.html">Reports</a>

</nav>

</header>

<main class="container">

<h2>Loan Applications</h2>

<table id="loanTable">

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>

</tr>

</table>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

let loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const table=document.getElementById("loanTable");

function save(){

localStorage.setItem("oas_loans",JSON.stringify(loans));

}

function load(){

table.innerHTML=`

<tr>

<th>Reference</th>
<th>Borrower</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>

</tr>

`;

if(loans.length===0){

table.innerHTML+=`

<tr>

<td colspan="5" align="center">

No Loan Applications

</td>

</tr>

`;

return;

}

loans.forEach((loan,index)=>{

table.innerHTML+=`

<tr>

<td>${loan.reference}</td>

<td>${loan.fullName}</td>

<td>₱${Number(loan.amount).toFixed(2)}</td>

<td>${loan.status}</td>

<td>

<button onclick="approve(${index})">

Approve

</button>

<button onclick="reject(${index})">

Reject

</button>

</td>

</tr>

`;

});

}

function approve(index){

loans[index].status="Approved";

save();

load();

}

function reject(index){

loans[index].status="Rejected";

save();

load();

}

load();

</script>

</body>
</html>
