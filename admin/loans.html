<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Management</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<h1>💰 Loan Management</h1>

</header>

<main class="container">

<h2>Loan Applications</h2>

<table border="1" width="100%" id="loanTable">

<tr>

<th>Reference</th>

<th>Borrower</th>

<th>Amount</th>

<th>Status</th>

<th>Action</th>

</tr>

</table>

<br>

<button onclick="window.location='dashboard.html'">

Back to Dashboard

</button>

</main>

<script>

let loans=JSON.parse(localStorage.getItem("oas_loans"))||[];

const table=document.getElementById("loanTable");

function loadLoans(){

table.innerHTML=`

<tr>

<th>Reference</th>

<th>Borrower</th>

<th>Amount</th>

<th>Status</th>

<th>Action</th>

</tr>

`;

if(loans.length===0){

table.innerHTML+=`

<tr>

<td colspan="5" align="center">

No Loan Applications

</td>

</tr>

`;

return;

}

loans.forEach((loan,index)=>{

table.innerHTML+=`

<tr>

<td>${loan.reference}</td>

<td>${loan.fullName}</td>

<td>₱${loan.amount}</td>

<td>${loan.status}</td>

<td>

<button onclick="approve(${index})">

Approve

</button>

<button onclick="reject(${index})">

Reject

</button>

</td>

</tr>

`;

});

}

function approve(index){

loans[index].status="Approved";

localStorage.setItem("oas_loans",JSON.stringify(loans));

loadLoans();

}

function reject(index){

loans[index].status="Rejected";

localStorage.setItem("oas_loans",JSON.stringify(loans));

loadLoans();

}

loadLoans();

</script>

</body>

</html>
